<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kernel Panic - Popcorn Boss Rush</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #2a2438 0%, #14111b 100%);
      color: #ffffff;
      font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 8px;
      max-width: 100vw;
    }

    .game-header {
      text-align: center;
    }

    .game-header h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: 2px;
      color: #ffd166;
      text-shadow: 0 4px 14px rgba(255, 209, 102, 0.4);
    }

    .game-header .subtitle {
      font-size: 0.9rem;
      color: #a9a1b8;
    }

    .canvas-container {
      position: relative;
      padding: 8px;
      border-radius: 24px;
      background: linear-gradient(145deg, #3e374d, #241f2e);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 2px 4px rgba(255, 255, 255, 0.12);
    }

    canvas {
      display: block;
      background-color: #2b2633;
      border-radius: 18px;
      width: min(90vw, 660px);
      height: min(90vw, 660px);
      max-height: 72vh;
      max-width: 72vh;
      position: relative;
      z-index: 1;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 8px;
      z-index: 20;
      border-radius: 18px;
      background: rgba(20, 17, 26, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 14px;
    }

    .overlay.hidden {
      display: none !important;
    }

    .overlay h2 {
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #ffd166;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .overlay p {
      color: #d0cadb;
      max-width: 440px;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      line-height: 1.4;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 540px;
    }

    .class-card {
      background: #2f293b;
      border: 2px solid #483f59;
      border-radius: 14px;
      padding: 12px 8px;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .class-card:hover {
      transform: translateY(-3px);
      border-color: #ffd166;
      background: #383147;
    }

    .class-card.selected {
      border-color: #00f5d4;
      background: #2d3b42;
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.35);
    }

    .class-icon {
      font-size: 1.6rem;
    }

    .class-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .class-desc {
      font-size: 0.74rem;
      color: #b4adc2;
      line-height: 1.25;
    }

    .btn-primary {
      background: linear-gradient(180deg, #ffd166 0%, #f4a261 100%);
      color: #1e1b24;
      border: none;
      border-bottom: 4px solid #c97b36;
      padding: 12px 32px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      transform: scale(1.03);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: rgba(43, 38, 51, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      color: #d0cadb;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .divider {
      color: #5b526b;
    }

    .key {
      display: inline-block;
      background: #3a3345;
      border: 1px solid #524861;
      border-bottom: 3px solid #221d29;
      padding: 2px 7px;
      border-radius: 6px;
      color: #ffd166;
      font-weight: 700;
      font-size: 0.76rem;
    }

    .space-key {
      color: #00bbf9;
      border-color: rgba(0, 187, 249, 0.4);
    }

    /* Mobile Touch Controls */
    .mobile-controls {
      display: none;
      width: min(90vw, 660px);
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .mobile-controls {
        display: flex;
      }
      .controls-bar {
        display: none;
      }
    }

    .touch-pad {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.15);
      position: relative;
      touch-action: none;
    }

    .touch-stick {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffd166;
      position: absolute;
      top: 31px;
      left: 31px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .touch-ability-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #00bbf9 0%, #0077b6 100%);
      border: 3px solid #90e0ef;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 6px 18px rgba(0, 187, 249, 0.4);
      cursor: pointer;
      touch-action: manipulation;
    }

    .touch-ability-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <header class="game-header">
      <h1>🍿 KERNEL PANIC</h1>
      <p class="subtitle">Dodge, deflect, and survive the skillet!</p>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="680" height="680"></canvas>

      <div id="startOverlay" class="overlay">
        <h2>CHOOSE YOUR KERNEL</h2>
        <p>Outlast all 3 kitchen bosses without getting popped. Deflecting bullets shaves time off the boss timer!</p>
        
        <div class="class-grid">
          <button type="button" id="card-shielder" class="class-card selected" onclick="selectClass('shielder')">
            <div class="class-icon">🛡️</div>
            <div class="class-name">Shielder</div>
            <div class="class-desc">Creates a bubble that deflects bullets back at bosses.</div>
          </button>
          <button type="button" id="card-dasher" class="class-card" onclick="selectClass('dasher')">
            <div class="class-icon">⚡</div>
            <div class="class-name">Dasher</div>
            <div class="class-desc">Quick invulnerable burst of speed to slip through tight gaps.</div>
          </button>
          <button type="button" id="card-healer" class="class-card" onclick="selectClass('healer')">
            <div class="class-icon">💖</div>
            <div class="class-name">Healer</div>
            <div class="class-desc">Starts with 3 hearts and can regenerate a lost heart.</div>
          </button>
        </div>

        <button type="button" id="startBtn" class="btn-primary" onclick="startGame()">ENTER THE SKILLET</button>
      </div>

      <div id="endOverlay" class="overlay hidden">
        <h2 id="endTitle">YOU GOT POPPED!</h2>
        <p id="endSubtitle">Better luck next batch.</p>
        <button type="button" id="restartBtn" class="btn-primary" onclick="startGame()">PLAY AGAIN [R]</button>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="mobile-controls">
      <div id="touchPad" class="touch-pad">
        <div id="touchStick" class="touch-stick"></div>
      </div>
      <button type="button" id="touchAbilityBtn" class="touch-ability-btn" onclick="triggerTouchAbility()">ABILITY</button>
    </div>

    <footer class="controls-bar">
      <div class="control-item">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or <span class="key">ARROWS</span> Move
      </div>
      <div class="divider">•</div>
      <div class="control-item">
        <span class="key space-key">SPACE</span> Ability
      </div>
      <div class="divider">•</div>
      <div class="control-item">
        <span class="key">P</span> Pause
      </div>
      <div class="divider">•</div>
      <div class="control-item">
        <span class="key">M</span> Mute
      </div>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Logical canvas dimensions (680x680)
    const LOGICAL_SIZE = 680;
    const ARENA = { x: 340, y: 355, radius: 280 };

    // Crisp Retina / High-DPI scaling
    function setupCanvasResolution() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = LOGICAL_SIZE * dpr;
      canvas.height = LOGICAL_SIZE * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    setupCanvasResolution();
    window.addEventListener('resize', setupCanvasResolution);
let audioCtx = null;
let isMuted = false;
let isPaused = false;
let selectedClass = 'shielder';
let gameState = 'MENU';
let stageIndex = 0;
let projectiles = [];
let particles = [];
let screenShake = 0;
let stageBannerTimer = 0;
function getAudioContext() {
if (!audioCtx) {
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
if (AudioContextClass) {
audioCtx = new AudioContextClass();
}
}
if (audioCtx && audioCtx.state === 'suspended') {
audioCtx.resume().catch(function() {});
}
return audioCtx;
}
function playSound(type) {
if (isMuted) return;
const ac = getAudioContext();
if (!ac) return;
try {
const osc = ac.createOscillator();
const gain = ac.createGain();
osc.connect(gain);
gain.connect(ac.destination);
const now = ac.currentTime;
if (type === 'select') {
osc.type = 'sine';
osc.frequency.setValueAtTime(580, now);
osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
gain.gain.setValueAtTime(0.12, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
osc.start(now);
osc.stop(now + 0.08);
} else if (type === 'deflect') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(520, now);
osc.frequency.exponentialRampToValueAtTime(1040, now + 0.12);
gain.gain.setValueAtTime(0.18, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
osc.start(now);
osc.stop(now + 0.12);
} else if (type === 'ability') {
osc.type = 'sine';
osc.frequency.setValueAtTime(320, now);
osc.frequency.exponentialRampToValueAtTime(640, now + 0.15);
gain.gain.setValueAtTime(0.15, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
osc.start(now);
osc.stop(now + 0.15);
} else if (type === 'hit') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(180, now);
osc.frequency.exponentialRampToValueAtTime(55, now + 0.25);
gain.gain.setValueAtTime(0.25, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
osc.start(now);
osc.stop(now + 0.25);
} else if (type === 'pop') {
osc.type = 'square';
osc.frequency.setValueAtTime(260, now);
osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
gain.gain.setValueAtTime(0.28, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
osc.start(now);
osc.stop(now + 0.35);
} else if (type === 'clear') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(440, now);
osc.frequency.setValueAtTime(660, now + 0.1);
osc.frequency.setValueAtTime(880, now + 0.2);
gain.gain.setValueAtTime(0.2, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
osc.start(now);
osc.stop(now + 0.4);
}
} catch (err) {}
}
function selectClass(cls) {
selectedClass = cls;
const cards = document.querySelectorAll('.class-card');
for (let i = 0; i < cards.length; i++) {
cards[i].classList.remove('selected');
}
const activeCard = document.getElementById('card-' + cls);
if (activeCard) activeCard.classList.add('selected');
playSound('select');
}
const keys = {};
window.addEventListener('keydown', function(e) {
keys[e.code] = true;
if (e.code === 'Space') {
e.preventDefault();
if (gameState === 'PLAYING' && !isPaused) player.useAbility();
}
if (e.code === 'KeyP' && gameState === 'PLAYING') {
isPaused = !isPaused;
}
if (e.code === 'KeyR' && (gameState === 'GAMEOVER' || gameState === 'VICTORY')) {
startGame();
}
if (e.code === 'KeyM') {
isMuted = !isMuted;
}
});
window.addEventListener('keyup', function(e) {
keys[e.code] = false;
});
// Touch Joystick Support
let touchMoveX = 0;
let touchMoveY = 0;
const touchPad = document.getElementById('touchPad');
const touchStick = document.getElementById('touchStick');
function handleTouchMove(e) {
e.preventDefault();
const touch = e.touches[0];
const rect = touchPad.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
let dx = touch.clientX - centerX;
let dy = touch.clientY - centerY;
const maxDist = 35;
const dist = Math.hypot(dx, dy);
if (dist > maxDist) {
dx = (dx / dist) * maxDist;
dy = (dy / dist) * maxDist;
}
touchStick.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
touchMoveX = dx / maxDist;
touchMoveY = dy / maxDist;
}
function resetTouchStick() {
touchStick.style.transform = 'translate(0px, 0px)';
touchMoveX = 0;
touchMoveY = 0;
}
touchPad.addEventListener('touchstart', handleTouchMove, { passive: false });
touchPad.addEventListener('touchmove', handleTouchMove, { passive: false });
touchPad.addEventListener('touchend', resetTouchStick);
touchPad.addEventListener('touchcancel', resetTouchStick);
function triggerTouchAbility() {
if (gameState === 'PLAYING' && !isPaused) {
player.useAbility();
}
}
const BOSSES = [
{ name: "STAGE 1: THE BUTTER STICK", color: "#ffe066", duration: 15, type: "butter" },
{ name: "STAGE 2: THE SALT SHAKER", color: "#f8f9fa", duration: 18, type: "salt" },
{ name: "STAGE 3: MAGNETRON (MICROWAVE)", color: "#00f5d4", duration: 22, type: "microwave" }
];
const player = {
x: 340,
y: 500,
radius: 14,
baseSpeed: 4.5,
hearts: 2,
maxHearts: 2,
invulnTimer: 0,
abilityTimer: 0,
abilityCooldown: 0,
maxCooldown: 2.0,
isPopped: false,
lastDirX: 0,
lastDirY: -1,
reset: function() {
this.x = 340;
this.y = 500;
this.maxHearts = selectedClass === 'healer' ? 3 : 2;
this.hearts = this.maxHearts;
this.invulnTimer = 0;
this.abilityTimer = 0;
this.abilityCooldown = 0;
this.isPopped = false;
},
useAbility: function() {
if (this.abilityCooldown > 0 || this.isPopped) return;
if (selectedClass === 'shielder') {
this.abilityTimer = 0.65;
this.maxCooldown = 2.0;
this.abilityCooldown = this.maxCooldown;
playSound('ability');
} else if (selectedClass === 'dasher') {
this.abilityTimer = 0.22;
this.maxCooldown = 1.6;
this.abilityCooldown = this.maxCooldown;
this.invulnTimer = 0.35;
spawnParticles(this.x, this.y, "#ffd166", 12);
playSound('ability');
} else if (selectedClass === 'healer') {
if (this.hearts < this.maxHearts) {
this.hearts++;
this.abilityTimer = 0.4;
this.maxCooldown = 5.5;
this.abilityCooldown = this.maxCooldown;
spawnParticles(this.x, this.y, "#ff595e", 16);
playSound('clear');
}
}
},
update: function(dt) {
if (this.isPopped) return;
if (this.invulnTimer > 0) this.invulnTimer -= dt;
if (this.abilityTimer > 0) this.abilityTimer -= dt;
if (this.abilityCooldown > 0) this.abilityCooldown -= dt;
let dx = touchMoveX;
let dy = touchMoveY;
if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
if (Math.hypot(dx, dy) > 0.05) {
const len = Math.max(1, Math.hypot(dx, dy));
const normX = dx / len;
const normY = dy / len;
this.lastDirX = normX / Math.hypot(normX, normY);
this.lastDirY = normY / Math.hypot(normX, normY);
const speed = (selectedClass === 'dasher' && this.abilityTimer > 0) ? 11.5 : this.baseSpeed;
this.x += normX * speed;
this.y += normY * speed;
} else if (selectedClass === 'dasher' && this.abilityTimer > 0) {
this.x += this.lastDirX * 11.5;
this.y += this.lastDirY * 11.5;
}
const distFromCenter = Math.hypot(this.x - ARENA.x, this.y - ARENA.y);
if (distFromCenter > ARENA.radius - this.radius) {
const angle = Math.atan2(this.y - ARENA.y, this.x - ARENA.x);
this.x = ARENA.x + Math.cos(angle) * (ARENA.radius - this.radius);
this.y = ARENA.y + Math.sin(angle) * (ARENA.radius - this.radius);
}
},
takeDamage: function() {
if (this.invulnTimer > 0 || this.isPopped) return;
if (selectedClass === 'shielder' && this.abilityTimer > 0) return;
this.hearts--;
this.invulnTimer = 1.5;
screenShake = 12;
spawnParticles(this.x, this.y, "#ff595e", 16);
if (this.hearts <= 0) {
this.isPopped = true;
spawnParticles(this.x, this.y, "#ffffff", 40);
playSound('pop');
setEndScreen(false);
} else {
playSound('hit');
}
},
draw: function() {
ctx.save();
ctx.translate(this.x, this.y);
// Cooldown ring indicator around kernel
if (!this.isPopped && this.abilityCooldown > 0) {
const pct = 1 - (this.abilityCooldown / this.maxCooldown);
ctx.strokeStyle = "rgba(0, 187, 249, 0.45)";
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.arc(0, 0, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
ctx.stroke();
}
if (this.invulnTimer > 0 && Math.floor(this.invulnTimer * 15) % 2 === 0) {
ctx.globalAlpha = 0.4;
}
if (this.isPopped) {
ctx.fillStyle = "#fff3b0";
for (let i = 0; i < 5; i++) {
const a = (i / 5) * Math.PI * 2;
ctx.beginPath();
ctx.arc(Math.cos(a) * 10, Math.sin(a) * 10, 12, 0, Math.PI * 2);
ctx.fill();
}
} else {
ctx.fillStyle = selectedClass === 'dasher' ? "#ff9f1c" : selectedClass === 'healer' ? "#ff758f" : "#ffca3a";
ctx.beginPath();
ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 1.5;
ctx.stroke();
ctx.fillStyle = "#1e1b24";
ctx.beginPath();
ctx.arc(-4, -3, 2.2, 0, Math.PI * 2);
ctx.arc(4, -3, 2.2, 0, Math.PI * 2);
ctx.fill();
}
if (selectedClass === 'shielder' && this.abilityTimer > 0) {
ctx.strokeStyle = "#00bbf9";
ctx.fillStyle = "rgba(0, 187, 249, 0.25)";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(0, 0, 28, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
}
ctx.restore();
}
};
const boss = {
x: 340,
y: 190,
radius: 36,
timer: 15,
attackCooldown: 0,
angle: 0,
laserAngle: 0,
laserWarmup: 0,
init: function(stage) {
this.x = ARENA.x;
this.y = ARENA.y - 155;
this.timer = stage.duration;
this.attackCooldown = 1.0;
this.angle = 0;
this.laserAngle = 0;
this.laserWarmup = 1.5;
projectiles = [];
stageBannerTimer = 1.6;
},
update: function(dt) {
const currentStage = BOSSES[stageIndex];
if (!currentStage) return;
this.timer -= dt;
this.attackCooldown -= dt;
this.angle += dt * 1.5;
if (this.timer <= 0) {
spawnParticles(this.x, this.y, currentStage.color, 45);
playSound('clear');
stageIndex++;
if (stageIndex >= BOSSES.length) {
setEndScreen(true);
} else {
this.init(BOSSES[stageIndex]);
}
return;
}
if (currentStage.type === "butter") {
this.x = ARENA.x + Math.sin(this.angle) * 155;
this.y = ARENA.y - 165;
if (this.attackCooldown <= 0) {
const aim = Math.atan2(player.y - this.y, player.x - this.x);
for (let i = -1; i <= 1; i++) {
spawnProjectile(this.x, this.y, aim + i * 0.28, 4.2, 10, "#ffe066", "rect");
}
this.attackCooldown = 0.85;
}
} else if (currentStage.type === "salt") {
this.x += (ARENA.x - this.x) * 0.05;
this.y += (ARENA.y - this.y) * 0.05;
if (this.attackCooldown <= 0) {
const arms = 4;
for (let i = 0; i < arms; i++) {
const shotAngle = this.angle * 2 + (i * Math.PI * 2) / arms;
spawnProjectile(this.x, this.y, shotAngle, 3.6, 6, "#ffffff", "circle");
}
this.attackCooldown = 0.14;
}
} else if (currentStage.type === "microwave") {
this.x = ARENA.x;
this.y = ARENA.y;

const a = (i / count) * Math.PI * 2;

function spawnProjectile(x, y, angle, speed, radius, color, shape) {
projectiles.push({
x: x,
y: y,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed,
radius: radius,
color: color,
shape: shape,
deflected: false
});
}
function spawnParticles(x, y, color, count) {
for (let i = 0; i < count; i++) {
const a = Math.random() * Math.PI * 2;
const s = Math.random() * 4 + 1;
particles.push({
x: x,
y: y,
vx: Math.cos(a) * s,
vy: Math.sin(a) * s,
life: 1.0,
color: color
});
}
}
function updateProjectiles() {
for (let i = projectiles.length - 1; i >= 0; i--) {
const p = projectiles[i];
p.x += p.vx;
p.y += p.vy;
if (Math.hypot(p.x - ARENA.x, p.y - ARENA.y) > ARENA.radius + 20) {
projectiles.splice(i, 1);
continue;
}
if (!p.deflected && selectedClass === 'shielder' && player.abilityTimer > 0) {
const distToPlayer = Math.hypot(p.x - player.x, p.y - player.y);
if (distToPlayer < 28 + p.radius) {
p.deflected = true;
p.color = "#00bbf9";
const bounceAngle = Math.atan2(p.y - player.y, p.x - player.x);
p.vx = Math.cos(bounceAngle) * 7.5;
p.vy = Math.sin(bounceAngle) * 7.5;
spawnParticles(p.x, p.y, "#00bbf9", 6);
playSound('deflect');
continue;
}
}
if (p.deflected) {
const distToBoss = Math.hypot(p.x - boss.x, p.y - boss.y);
if (distToBoss < boss.radius + p.radius) {
boss.timer -= 0.45;
spawnParticles(p.x, p.y, "#00bbf9", 8);
projectiles.splice(i, 1);
continue;
}
} else {
const distToPlayer = Math.hypot(p.x - player.x, p.y - player.y);
if (distToPlayer < player.radius + p.radius - 3) {
player.takeDamage();
projectiles.splice(i, 1);
}
}
}
}

ctx.fillStyle = "#ffd166";
ctx.font = "bold 40px 'Fredoka', 'Segoe UI', sans-serif";

}
